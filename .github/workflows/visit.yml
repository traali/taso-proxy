name: Monastic Clean-Room Pre-Visitation Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - run: npm test
      - run: npm run typecheck
